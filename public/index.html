<body>

<div class="app-shell" data-state="home" data-has-roles="false">

<!-- ===== SHELL HEADER ===== -->
<header class="shell-header">
  <button type="button" class="shell-menu-btn" aria-controls="shell-nav" aria-expanded="false" aria-label="Menu">
    <svg viewBox="0 0 20 20" fill="currentColor" aria-hidden="true"><path fill-rule="evenodd" d="M3 5a1 1 0 011-1h12a1 1 0 110 2H4a1 1 0 01-1-1zm0 5a1 1 0 011-1h12a1 1 0 110 2H4a1 1 0 01-1-1zm0 5a1 1 0 011-1h12a1 1 0 110 2H4a1 1 0 01-1-1z" clip-rule="evenodd"/></svg>
  </button>
  <a class="logo" href="#/">
    <span class="logo-mark" aria-hidden="true">K</span>
    Kairo
  </a>
  <div id="theme-toggle-slot" class="shell-header-end"></div>
</header>

<!-- ===== SHELL NAV (left nav ≥768px, menu drawer on phones) ===== -->
<nav class="shell-nav" id="shell-nav" aria-label="Main">
  <a class="shell-link" href="#/today" data-dest="today">
    <svg class="nav-icon" viewBox="0 0 20 20" fill="currentColor" aria-hidden="true"><path fill-rule="evenodd" d="M6 2a1 1 0 00-1 1v1H4a2 2 0 00-2 2v10a2 2 0 002 2h12a2 2 0 002-2V6a2 2 0 00-2-2h-1V3a1 1 0 10-2 0v1H7V3a1 1 0 00-1-1zm0 5a1 1 0 000 2h8a1 1 0 100-2H6z" clip-rule="evenodd"/></svg>
    Today
  </a>
  <a class="shell-link" href="#/pipeline" data-dest="pipeline">
    <svg class="nav-icon" viewBox="0 0 20 20" fill="currentColor" aria-hidden="true"><path d="M3 4a1 1 0 011-1h12a1 1 0 110 2H4a1 1 0 01-1-1zM3 10a1 1 0 011-1h6a1 1 0 110 2H4a1 1 0 01-1-1zM3 16a1 1 0 011-1h12a1 1 0 110 2H4a1 1 0 01-1-1z"/></svg>
    Pipeline <span class="nav-badge" id="sb-badge">0</span>
  </a>
  <a class="shell-link" href="#/stories" data-dest="stories">
    <svg class="nav-icon" viewBox="0 0 20 20" fill="currentColor" aria-hidden="true"><path fill-rule="evenodd" d="M18 10c0 3.866-3.582 7-8 7a8.841 8.841 0 01-4.083-.98L2 17l1.338-3.123C2.493 12.767 2 11.434 2 10c0-3.866 3.582-7 8-7s8 3.134 8 7zM7 9H5v2h2V9zm8 0h-2v2h2V9zM9 9h2v2H9V9z" clip-rule="evenodd"/></svg>
    Story bank <span class="nav-badge" id="sb-stories-badge">0</span>
  </a>
  <a class="shell-link" href="#/profile" data-dest="profile">
    <svg class="nav-icon" viewBox="0 0 20 20" fill="currentColor" aria-hidden="true"><path fill-rule="evenodd" d="M10 9a3 3 0 100-6 3 3 0 000 6zm-7 9a7 7 0 1114 0H3z" clip-rule="evenodd"/></svg>
    Profile &amp; CV
  </a>
  <a class="shell-link shell-link-add" href="#/add" data-dest="add">
    <svg class="nav-icon" viewBox="0 0 20 20" fill="currentColor" aria-hidden="true"><path fill-rule="evenodd" d="M10 3a1 1 0 011 1v5h5a1 1 0 110 2h-5v5a1 1 0 11-2 0v-5H4a1 1 0 110-2h5V4a1 1 0 011-1z" clip-rule="evenodd"/></svg>
    Add role
  </a>
</nav>

<!-- ===== MAIN CONTENT (views render here; the site footer is mounted last by shell.js) ===== -->
<main class="main-content" id="app-main"></main>

<nav class="shell-bottom-nav" aria-label="Primary">

    Today
  </a>
  <a class="shell-tab" href="#/pipeline" data-dest="pipeline">

  </a>
  <a class="shell-tab" href="#/stories" data-dest="stories">
    <svg viewBox="0 0 20 20" fill="currentColor" aria-hidden="true"><path fill-rule="evenodd" d="M18 10c0 3.866-3.582 7-8 7a8.841 8.841 0 01-4.083-.98L2 17l1.338-3.123C2.493 12.767 2 11.434 2 10c0-3.866 3.582-7 8-7s8 3.134 8 7zM7 9H5v2h2V9zm8 0h-2v2h2V9zM9 9h2v2H9V9z" clip-rule="evenodd"/></svg>
    Stories
  </a>
  <a class="shell-tab" href="#/profile" data-dest="profile">
    <svg viewBox="0 0 20 20" fill="currentColor" aria-hidden="true"><path fill-rule="evenodd" d="M10 9a3 3 0 100-6 3 3 0 000 6zm-7 9a7 7 0 1114 0H3z" clip-rule="evenodd"/></svg>
    Profile
  </a>

</div><!-- /.app-shell -->

<script type="module" src="/js/main.js"></script>

</html>
