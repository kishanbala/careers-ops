name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      # Pixel-diff baselines (e2e/split.spec.js): render the PR base in this same runner, then compare the PR build to it.
      # Not under e2e-results/: Playwright empties its outputDir at the start of every run.
      - uses: actions/checkout@v7
        if: github.event_name == 'pull_request'
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: pre-split
      - run: node e2e/capture-baseline.mjs pre-split/public baseline-ci
        if: github.event_name == 'pull_request'
        env:
          CI: "true"
      - run: npx playwright test --trace off
        env:
          CI: "true"
          BASELINE_DIR: ${{ github.event_name == 'pull_request' && 'baseline-ci' || '' }}
          SPLIT_SKIP: ${{ github.event_name == 'pull_request' && '0' || '1' }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e-screenshots-and-axe
          path: e2e-results/
          if-no-files-found: ignore
